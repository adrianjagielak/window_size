name: window_size
description: Allows resizing and repositioning the window containing Flutter.
version: 0.1.0
repository: https://github.com/adrianjagielak/window_size

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: WindowSizePlugin
      macos:
        pluginClass: WindowSizePlugin
      windows:
        pluginClass: WindowSizePlugin

environment:
  sdk: '>=2.12.0-0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
